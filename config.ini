// The Little Dict · Refreshed
// 修改后请重新导入词典；布尔开关统一使用 0（关闭）或 1（开启）。


// ===== 词条头部 =====

// 显示所查单词、音标和词形变化。
header = 1;

// “考试标签与星级”的首次使用默认值；页面中已保存的显示偏好优先。
exam = 1;


// ===== 发音 =====

// p.css 默认隐藏词条内的发音图标；如需显示，还需移除对应隐藏样式，
// 并确保词典的图片和音频资源完整。以下开关只决定各类发音是否参与显示。

// 显示英式发音图标。
pronuk = 1;

// 显示美式发音图标。
pronus = 1;

// 发音图标顺序：0 英式优先，1 美式优先。
order = 1;

// PC 端进入词条时自动发音。
auto_pron = 0;

// 手机端进入词条时自动发音。
mobile_auto_pron = 0;


// ===== 词频卡片 =====

// Word Frequency 默认状态：0 折叠，1 展开，2 完全隐藏。
freq_expand = 0;

// Phrase Frequency 默认状态：0 折叠，1 展开。
phrase_freq_expand = 0;

// 以下四项是页面显示设置的首次使用默认值；页面中已保存的显示偏好优先。

// 显示 COCA 词频来源。
coca = 1;

// 显示 iWeb 词频来源。iWeb 不提供悬浮语域明细。
iweb = 1;

// 显示 Spoken 口语词频来源。
spoken = 1;

// 显示 Phrase Frequency 短语词频卡片。
EPFD = 1;


// ===== 释义 =====

// 显示 Word Frequency 卡片下方的“释义 + 百分比”胶囊。
// 此开关不控制卡片内部的词性占比条；正式版不会生成词性占比条。
ex_ratio = 1;

// 显示按词性分组的中文释义。
definition = 1;


// ===== 主题 =====

// 主题模式：0 跟随系统或词典软件，1 强制浅色，2 强制深色。
dark_mode = 0;
