  <rect x="1024" y="238" width="120" height="168" rx="16" fill="none" stroke="#5A6268" stroke-width="2"/>

  <rect x="696" y="368" width="160" height="28" rx="14" fill="#101214" fill-opacity="0.92"/>
  <text x="776" y="387" text-anchor="middle" fill="#F8F5EE" font-size="14" font-weight="700"
