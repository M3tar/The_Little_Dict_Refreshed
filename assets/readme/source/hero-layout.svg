  <title id="title">The Little Dict Refreshed 0.2.0</title>
  <desc id="desc">稳定查询与可配置词频显示，右侧展示浅色与深色移动端实机界面。</desc>
  <defs>
    <clipPath id="light-shot"><rect x="678" y="34" width="466" height="372" rx="22"/></clipPath>
    <clipPath id="dark-shot"><rect x="1024" y="238" width="120" height="168" rx="16"/></clipPath>
  </defs>

  <rect width="1200" height="440" rx="30" fill="#101214"/>
  <path d="M0 352H620" stroke="#293036"/>
  <circle cx="67" cy="56" r="7" fill="#72A9BC"/>
  <text x="86" y="63" fill="#9CA3AA" font-size="18" font-weight="650"
